<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#07110e" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <title>Offline · Zilla Milestones</title>
    <style>
      :root { color-scheme: dark; }
      * { box-sizing: border-box; }
      body {
        margin: 0;
        min-height: 100vh;
        min-height: 100dvh;
        display: grid;
        place-items: center;
        padding: max(24px, env(safe-area-inset-top)) max(20px, env(safe-area-inset-right)) max(24px, env(safe-area-inset-bottom)) max(20px, env(safe-area-inset-left));
        background:
          radial-gradient(900px 420px at 10% -10%, rgba(214, 242, 106, 0.14), transparent 55%),
          #07110e;
        color: #f4f7f5;
        font-family: ui-sans-serif, system-ui, sans-serif;
      }
      main {
        width: min(100%, 440px);
        border: 1px solid #24382f;
        border-radius: 28px;
        background: rgba(16, 26, 22, 0.94);
        padding: 28px 24px 24px;
        box-shadow: 0 20px 60px rgba(0, 0, 0, 0.35);
      }
      .mark {
        width: 56px;
        height: 56px;
        border-radius: 16px;
        display: block;
      }
      h1 {
        margin: 18px 0 0;
        font-family: Georgia, "Iowan Old Style", serif;
        font-size: 2rem;
        line-height: 1.05;
        font-weight: 700;
      }
      p { margin: 12px 0 0; color: #d5dee6; line-height: 1.5; }
      button {
        margin-top: 22px;
        border: 0;
        border-radius: 999px;
        background: #d6f26a;
        color: #07110e;
        font: inherit;
        font-weight: 700;
        padding: 12px 18px;
        cursor: pointer;
      }
      .host { margin-top: 18px; color: #d6f26a; font-size: 0.85rem; letter-spacing: 0.04em; }
    </style>
  </head>
  <body>
    <main>
      <svg class="mark" viewBox="0 0 64 64" aria-hidden="true">
        <rect width="64" height="64" rx="14" fill="#07110e"/>
        <path d="M16 18h28l-18 14h18L22 48" fill="none" stroke="#d6f26a" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>
      </svg>
      <h1>You're offline</h1>
      <p>Zilla Milestones needs a connection to load this plan and to reach PayPal. Nothing was invoiced or sent from this screen.</p>
      <form action="/" method="get">
        <button type="submit">Try again</button>
      </form>
      <p class="host">milestones.zillalabs.ai</p>
    </main>
  </body>
</html>
